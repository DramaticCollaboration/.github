name: SyncSeries CI Pull Request Gate

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  PYTHON_VERSION: "3.12"

jobs:
  governance-and-db-integrity:
    name: Zero-Mock, Hardcoded Smell, DB Seed & POM Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python YAML validator dependency
        run: python -m pip install --no-cache-dir pyyaml

      - name: Verify Zero-Mock gate
        run: python scripts/hook-zero-mock-gate.py --dir .

      - name: Verify hardcoded agent smells
        run: python scripts/verify-hardcoded-smells.py . --fail-on-error

      - name: Verify 6-File DB SSOT schemas and seeds
        run: python scripts/verify-db-seeds.py

      - name: Verify POM UTF-8 encoding and XML integrity
        run: pwsh -NoProfile -File scripts/verify-pom-encoding.ps1

      - name: Validate YAML syntax across profiles, compose, CI, and K8s
        run: |
          python - <<'PY'
          import glob, pathlib, sys, yaml

          patterns = [
              "docker-compose-*.yml",
              ".github/workflows/*.yml",
              "deploy/helm/syncseries/Chart.yaml",
              "deploy/helm/syncseries/values.yaml",
              "sync-eta/k8s/**/*.yaml",
              "sync-shop/Server/document/k8s/*.yaml",
              "*/Server/*/src/main/resources/application*.yml",
              "services/*/Server/*/src/main/resources/application*.yml",
          ]
          files = sorted({p for pat in patterns for p in glob.glob(pat, recursive=True)})
          if not files:
              sys.exit("No YAML files matched validation patterns")
          errors = []
          for f in files:
              try:
                  list(yaml.safe_load_all(pathlib.Path(f).read_text(encoding="utf-8")))
              except Exception as exc:
                  errors.append(f"{f}: {exc}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Validated {len(files)} YAML files successfully.")
          PY

  backend-build-and-test:
    name: Backend Maven Build, Unit Tests & JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: governance-and-db-integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile and run backend unit tests
        run: mvn -B -ntp -T 1C test-compile test

      - name: Generate JaCoCo aggregate coverage reports
        if: success()
        run: mvn -B -ntp jacoco:report -DskipTests

      - name: Upload Surefire and JaCoCo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          if-no-files-found: warn
          retention-days: 14

  frontend-lint-test-build:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: governance-and-db-integrity
    strategy:
      fail-fast: false
      matrix:
        app:
          - sync-boot/admin
          - sync-verse/admin
          - sync-verse/user
          - sync-verse/studio
          - sync-llm/admin
          - sync-cms/admin
          - sync-shop/admin
          - sync-shop/app
          - sync-ops/admin
          - sync-apim/admin
          - sync-watch/admin
          - sync-crawl/admin
          - sync-eta/sync-eta-agent/admin
          - services/today-care/admin
          - services/today-care/family-app
          - services/today-care/senior-app
          - services/awesome-fit/admin
          - services/awesome-fit/web
          - services/kkumz/admin
          - services/kkumz/web
          - sites/sync-portal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "Missing pnpm-lock.yaml in ${{ matrix.app }}" >&2
            exit 1
          fi

      - name: Run lint if configured
        working-directory: ${{ matrix.app }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            pnpm run lint
          fi

      - name: Run unit tests if configured
        working-directory: ${{ matrix.app }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            pnpm run test -- --run || pnpm run test
          fi

      - name: Build production bundle
        working-directory: ${{ matrix.app }}
        run: pnpm run build

  iac-and-helm-lint:
    name: Terraform & Helm Chart Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate AWS Terraform configuration
        working-directory: terraform/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Azure Terraform configuration
        working-directory: terraform/azure
        run: |
          terraform init -backend=false
          terraform validate

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Lint and render SyncSeries umbrella Helm chart
        run: |
          helm lint deploy/helm/syncseries --strict
          helm template syncseries deploy/helm/syncseries --namespace syncseries > /tmp/syncseries-rendered.yaml
          test -s /tmp/syncseries-rendered.yaml
